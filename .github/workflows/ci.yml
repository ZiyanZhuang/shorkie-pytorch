name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,figure]"
      - run: python -m pytest -q
      - run: python benchmarks/v0.1.0-rc1/generate_ppl_figure.py --check
      - run: python -m build
      - run: python scripts/audit_release.py --root . --output audit/release-scan.json
